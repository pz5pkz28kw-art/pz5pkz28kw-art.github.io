<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
padding:22px;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:linear-gradient(145deg,#f5f7f9,#e3e8ed);
color:#111827;
display:flex;
align-items:center;
justify-content:center

.card{
position:relative;
overflow:hidden;
width:min(440px,100%);
background:rgba(255,255,255,.97);
border-radius:30px;
padding:34px 25px 28px;
box-shadow:0 20px 60px rgba(0,0,0,.13);
text-align:center
}

.card:before,.card:after{
content:"";
position:absolute;
width:170px;
height:170px;
border-radius:50%;
pointer-events:none;
opacity:.7
}

.card:before{
left:-100px;
top:-100px;
background:linear-gradient(135deg,#eaf4ff,#dfeeff)
}

.card:after{
right:-105px;
bottom:-105px;
background:linear-gradient(135deg,#ffdfe1,#ffb9bd)
}

.content{
position:relative;
z-index:1
}

.logo{
display:inline-block;
font-weight:850;
font-size:31px;
letter-spacing:-1.5px;
border:3px solid #e30613;
border-radius:10px;
padding:2px 10px;
margin-bottom:25px
}

h1{
margin:0;
font-size:38px;
letter-spacing:-1.4px
}

.sub{
margin:6px 0 25px;
color:#5b6678;
font-size:18px;
font-weight:500
}

.line{
width:78px;
height:4px;
background:#e30613;
border-radius:4px;
margin:0 auto 27px
}

.info{
display:flex;
align-items:center;
gap:14px;
text-align:left;
background:#f2f5f8;
border-radius:18px;
padding:14px 16px;
margin:11px 0;
text-decoration:none;
color:#111827
}

.icon{
width:45px;
height:45px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#e3e9f0;
font-size:22px;
flex:0 0 45px
}

.info-text{
font-size:16px;
font-weight:650;
overflow-wrap:anywhere
}

.socials{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:20px
}

.social{
display:flex;
align-items:center;
justify-content:center;
gap:9px;
padding:16px 10px;
border-radius:17px;
color:white;
text-decoration:none;
font-weight:750;
font-size:16px;
box-shadow:0 8px 20px rgba(0,0,0,.09)
}

.telegram{
background:#18aeea
}

.whatsapp{
background:#10bd63
}

.social svg{
width:24px;
height:24px;
fill:currentColor
}

.footer{
margin-top:27px;
color:#8a96a8;
font-size:12px;
letter-spacing:3px;
display:flex;
align-items:center;
gap:12px;
justify-content:center
}

.footer:before,.footer:after{
content:"";
height:1px;
background:#d1d7df;
width:55px
}

@media(max-width:380px){
h1{font-size:34px}
.social{font-size:14px}
.info-text{font-size:14px}
}
</style>
